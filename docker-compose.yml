# Avvio: docker compose up -d   (impostazioni nel file .env, vedi .env.example)
services:
  radar:
    build: .
    command: ["python", "-m", "yspa", "run", "--every", "60"]
    env_file: .env
    volumes: ["./data:/data"]
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    volumes: ["./data:/data"]
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
