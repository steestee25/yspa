name: diagnose-sources

on:
  workflow_dispatch:
  push:
    branches: [claude/wonderful-franklin-ay2r0p]
    paths: [".github/workflows/diagnose.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Formato CNBC e Nasdaq
        run: |
          B="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -m 20 -A "$B" "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=MRNA%7CBSP%7CSPCX%7CNBIS%7CRHM-DE%7CASML-NL%7CARGX-BE%7CNOVOB-DK%7CSTMMI-IT%7CLDO-IT%7CONCY%7CXXXXNOPE&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1" > cnbc.json
          python3 - <<'PY'
          import json
          d = json.load(open("cnbc.json"))
          quotes = d["FormattedQuoteResult"]["FormattedQuote"]
          print("chiavi:", sorted(quotes[0].keys()))
          for q in quotes:
              ext = q.get("ExtendedMktQuote") or {}
              print({k: q.get(k) for k in ("symbol", "code", "name", "last", "last_time", "previous_day_closing", "change_pct", "currencyCode", "exchange", "curmktstatus", "timeZone")}, "| ext:", {k: ext.get(k) for k in ("type", "last", "last_time", "change_pct")})
          PY
          for s in MRNA BSP; do
            curl -sS -m 20 -A "$B" -H "Accept: application/json" "https://api.nasdaq.com/api/quote/$s/chart?assetclass=stocks" > n.json
            python3 - "$s" <<'PY'
          import json, sys
          d = json.load(open("n.json"))["data"] or {}
          print(sys.argv[1], "chiavi:", sorted(d.keys()))
          print({k: d.get(k) for k in d if k != "chart"})
          ch = d.get("chart") or []
          print("barre:", len(ch), "prima:", ch[:1], "ultima:", ch[-1:])
          PY
          done
