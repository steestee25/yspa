name: radar

on:
  workflow_dispatch:
  push:
    branches: [claude/wonderful-franklin-ay2r0p]
    paths: ["yspa/**", "tests/**", "requirements*.txt", "Dockerfile", "docker-compose.yml", "deploy/**", ".github/workflows/radar.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  live:
    # Prova dal vivo: fonti vere, prezzi veri, per qualche minuto.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YSPA_SEC_USER_AGENT: ${{ secrets.YSPA_SEC_USER_AGENT || 'YSPA radar 223326988+steestee25@users.noreply.github.com' }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prezzi in tempo reale della watchlist
        run: python -m yspa quotes
      - name: Copertura dei prezzi su altre borse europee e Canada
        run: python -m yspa quotes MC.PA SHEL.L NESN.SW SAN.MC NOKIA.HE EQNR.OL EDP.LS SHOP.TO VOLV-B.ST ENI.MI SAP.DE
      - name: Raccolta continua (8 giri, uno al minuto)
        run: python -m yspa run --every 60 --cycles 8 --report
      - name: Notizie salvate (voto da 3 in su)
        run: python -m yspa export | python -c "import sys, json; [print(l, end='') for l in sys.stdin if json.loads(l)['score'] >= 3]"

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build e avvio con docker compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          echo
          curl -sf -o /dev/null -w "pagina: HTTP %{http_code}\n" http://localhost:8000/
          sleep 20
          docker compose ps
          docker compose logs --tail 20 radar
          docker compose down

  deploy:
    # Esegue lo script di installazione del server su una macchina Ubuntu pulita, come su Oracle Cloud.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/setup-server.sh
      - name: Installazione (scarica il codice da GitHub, come sul server vero)
        run: |
          sudo YSPA_SEC_USER_AGENT="Prova Installazione prova@example.com" YSPA_PASSWORD="prova123" \
               YSPA_DOMAIN="localhost" YSPA_BRANCH="${{ github.ref_name }}" bash deploy/setup-server.sh < /dev/null
      - name: HTTPS con password
        run: |
          curl -sk -o /dev/null -w "senza password: HTTP %{http_code}\n" https://localhost/
          curl -sk -o /dev/null -w "con password:   HTTP %{http_code}\n" -u io:prova123 https://localhost/
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' -u io:prova123 https://localhost/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)" = 401
      - name: Seconda esecuzione = aggiornamento, impostazioni conservate
        run: |
          sudo YSPA_BRANCH="${{ github.ref_name }}" bash deploy/setup-server.sh < /dev/null
          sudo grep -q 'YSPA_PASSWORD="prova123"' /opt/yspa/.env
          cd /opt/yspa && sudo docker compose --profile https ps
