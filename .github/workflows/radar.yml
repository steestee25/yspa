name: radar

on:
  workflow_dispatch:
  push:
    branches: [claude/wonderful-franklin-ay2r0p]
    paths: ["yspa/**", ".github/workflows/radar.yml"]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Formato grezzo dei feed (diagnostica)
        run: |
          for u in "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies" \
                   "https://www.prnewswire.com/rss/news-releases-list.rss" \
                   "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFpRWQ=="; do
            echo "=== $u"; curl -sSL -A "yspa/0.1" "$u" | head -c 4000; echo
          done
      - name: Un giro di raccolta
        env:
          # Impostabile come secret del repository; la SEC chiede nome ed email.
          YSPA_SEC_USER_AGENT: ${{ secrets.YSPA_SEC_USER_AGENT || 'YSPA radar 223326988+steestee25@users.noreply.github.com' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m yspa fetch --report
